services:
  db:
    image: postgres:16-alpine
    container_name: visitflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitflow}
      POSTGRES_DB: ${POSTGRES_DB:-visitflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - visitflow_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-visitflow} -d ${POSTGRES_DB:-visitflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visitflow_pgdata:
